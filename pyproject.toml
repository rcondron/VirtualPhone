[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "virtualphone"
version = "1.0.0"
description = "Virtual eUICC with full telecom stack for Android-in-Docker"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "cryptography>=41.0",
    "pycryptodome>=3.19",
    "pyscard>=2.0",
    "asn1tools>=0.166",
    "pyasn1>=0.5",
    "httpx>=0.25",
    "aiohttp>=3.9",
    "aiosip>=0.3",
    "fastapi>=0.104",
    "uvicorn>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "httpx",  # for FastAPI TestClient
]

[project.scripts]
vphone-euicc = "euicc.daemon:main"
vphone-hal = "hal.service:run"
vphone-ims = "ims.service:run"
vphone-rsp = "rsp.service:run"

[tool.setuptools.packages.find]
include = ["euicc*", "hal*", "ims*", "rsp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[tool.setuptools.package-data]
"config" = ["*.yaml", "*.conf"]
