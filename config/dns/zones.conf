; CoreDNS configuration for IMS domain resolution
; Provides the DNS records required for IMS service discovery
;
; Zone: mnc001.mcc001.3gppnetwork.org

; IMS domain zone
ims.mnc001.mcc001.3gppnetwork.org. {
    file /etc/coredns/db.ims
    log
}

; EPC domain zone
epc.mnc001.mcc001.3gppnetwork.org. {
    file /etc/coredns/db.epc
    log
}

; Fallback for everything else
. {
    forward . 8.8.8.8 8.8.4.4
    cache 30
    log
}
