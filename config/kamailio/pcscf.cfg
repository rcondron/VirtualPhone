#!KAMAILIO
#
# Kamailio P-CSCF (Proxy-CSCF) Configuration
#
# The P-CSCF is the first point of contact for the UE in the IMS network.
# It handles:
# - SIP REGISTER relay to I-CSCF
# - IPsec security association setup (optional)
# - Emergency call detection
# - Media anchoring / policy enforcement
#
# Reference: 3GPP TS 24.229 Section 5.2
#

#!define WITH_DEBUG
#!define PCSCF_HOST "pcscf.ims.mnc001.mcc001.3gppnetwork.org"
#!define PCSCF_IP "172.28.0.41"
#!define PCSCF_PORT 5060
#!define ICSCF_HOST "icscf.ims.mnc001.mcc001.3gppnetwork.org"
#!define ICSCF_IP "172.28.0.42"
#!define ICSCF_PORT 5060
#!define IMS_DOMAIN "ims.mnc001.mcc001.3gppnetwork.org"

####### Global Parameters #########
debug=4
log_stderror=yes
memdbg=5
memlog=5

log_facility=LOG_LOCAL0
log_prefix="[P-CSCF] "

fork=yes
children=2
auto_aliases=no

listen=udp:PCSCF_IP:PCSCF_PORT
listen=tcp:PCSCF_IP:PCSCF_PORT

sip_warning=no
server_header="Server: VirtualPhone P-CSCF"
user_agent_header="User-Agent: VirtualPhone P-CSCF"

####### Modules Section ########

loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "nathelper.so"
loadmodule "path.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"

# -- module parameters --
modparam("tm", "fr_timer", 5000)
modparam("tm", "fr_inv_timer", 30000)
modparam("rr", "enable_full_lr", 0)
modparam("rr", "append_fromtag", 1)
modparam("registrar", "default_expires", 3600)
modparam("registrar", "max_expires", 7200)
modparam("registrar", "min_expires", 600)
modparam("usrloc", "db_mode", 0)
modparam("path", "use_received", 1)

####### Routing Logic ########

request_route {
    # Per-request initial processing
    route(REQINIT);

    # CANCEL processing
    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            route(RELAY);
        }
        exit;
    }

    # Handle retransmissions
    if (!is_method("ACK")) {
        if (t_precheck_trans()) {
            t_check_trans();
            exit;
        }
        t_check_trans();
    }

    # Record-Route for dialog-forming requests
    if (is_method("INVITE|SUBSCRIBE")) {
        record_route();
    }

    # Handle REGISTER - relay to I-CSCF
    if (is_method("REGISTER")) {
        route(REGISTER);
        exit;
    }

    # Requests within a dialog
    if (has_totag()) {
        if (loose_route()) {
            route(RELAY);
            exit;
        }
    }

    # Initial requests
    route(RELAY);
}

# -- Request sanity checks --
route[REQINIT] {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    if (is_method("OPTIONS") && uri==myself) {
        sl_send_reply("200", "OK");
        exit;
    }

    if (!sanity_check("17895", "7")) {
        xlog("L_WARN", "Malformed SIP request from $si:$sp\n");
        exit;
    }
}

# -- REGISTER handling --
route[REGISTER] {
    xlog("L_INFO", "P-CSCF: REGISTER from $fu ($si:$sp)\n");

    # Add Path header so responses route back through us
    add_path_received();

    # Forward REGISTER to I-CSCF
    $du = "sip:" + ICSCF_IP + ":" + ICSCF_PORT;
    route(RELAY);
}

# -- Generic relay --
route[RELAY] {
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

# -- Reply routing --
onreply_route {
    xlog("L_INFO", "P-CSCF: Reply $rs $rr for $ci\n");
}

# -- Failure routing --
failure_route[FAIL] {
    if (t_is_canceled()) {
        exit;
    }
}
