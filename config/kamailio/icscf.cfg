#!KAMAILIO
#
# Kamailio I-CSCF (Interrogating-CSCF) Configuration
#
# The I-CSCF is the entry point into an IMS network for registrations
# and incoming sessions. It queries the HSS to:
# - Find the appropriate S-CSCF for a user during registration (UAR/UAA)
# - Route incoming requests to the correct S-CSCF (LIR/LIA)
#
# Reference: 3GPP TS 24.229 Section 5.3
#

#!define ICSCF_HOST "icscf.ims.mnc001.mcc001.3gppnetwork.org"
#!define ICSCF_IP "172.28.0.42"
#!define ICSCF_PORT 5060
#!define SCSCF_HOST "scscf.ims.mnc001.mcc001.3gppnetwork.org"
#!define SCSCF_IP "172.28.0.43"
#!define SCSCF_PORT 5060
#!define IMS_DOMAIN "ims.mnc001.mcc001.3gppnetwork.org"

####### Global Parameters #########
debug=4
log_stderror=yes
memdbg=5
memlog=5

log_facility=LOG_LOCAL0
log_prefix="[I-CSCF] "

fork=yes
children=2
auto_aliases=no

listen=udp:ICSCF_IP:ICSCF_PORT
listen=tcp:ICSCF_IP:ICSCF_PORT

sip_warning=no
server_header="Server: VirtualPhone I-CSCF"
user_agent_header="User-Agent: VirtualPhone I-CSCF"

####### Modules Section ########

loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"

# -- module parameters --
modparam("tm", "fr_timer", 5000)
modparam("tm", "fr_inv_timer", 30000)

####### Routing Logic ########

request_route {
    route(REQINIT);

    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            route(RELAY);
        }
        exit;
    }

    if (!is_method("ACK")) {
        if (t_precheck_trans()) {
            t_check_trans();
            exit;
        }
        t_check_trans();
    }

    # REGISTER - query HSS for S-CSCF assignment then forward
    if (is_method("REGISTER")) {
        route(REGISTER);
        exit;
    }

    # For initial requests, route to S-CSCF
    route(TO_SCSCF);
}

route[REQINIT] {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    if (is_method("OPTIONS") && uri==myself) {
        sl_send_reply("200", "OK");
        exit;
    }

    if (!sanity_check("17895", "7")) {
        xlog("L_WARN", "Malformed SIP request from $si:$sp\n");
        exit;
    }
}

# -- REGISTER handling --
# In a full IMS deployment, the I-CSCF would query the HSS via Diameter (Cx)
# to find the assigned S-CSCF. For our test environment, we statically route
# to the single S-CSCF instance.
route[REGISTER] {
    xlog("L_INFO", "I-CSCF: REGISTER from $fu, forwarding to S-CSCF\n");
    route(TO_SCSCF);
}

# -- Route to S-CSCF --
route[TO_SCSCF] {
    xlog("L_INFO", "I-CSCF: Routing to S-CSCF at " + SCSCF_IP + ":" + SCSCF_PORT + "\n");
    $du = "sip:" + SCSCF_IP + ":" + SCSCF_PORT;
    route(RELAY);
}

# -- Generic relay --
route[RELAY] {
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

onreply_route {
    xlog("L_INFO", "I-CSCF: Reply $rs $rr\n");
}
