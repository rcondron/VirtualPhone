#!KAMAILIO
#
# Kamailio S-CSCF (Serving-CSCF) Configuration
#
# The S-CSCF handles:
# - SIP registration (REGISTER with AKA authentication)
# - Session control (INVITE routing)
# - Service trigger point evaluation
# - IMS service execution
#
# For authentication, the S-CSCF:
# 1. Receives REGISTER from I-CSCF
# 2. Queries auth-helper for AKA auth vectors (via HTTP)
# 3. Sends 401 with AKA challenge (nonce = base64(RAND || AUTN))
# 4. Receives re-REGISTER with Authorization header
# 5. Verifies Digest-AKA response via auth-helper and sends 200 OK
#
# In this test setup, the auth-helper sidecar replaces the Diameter Cx
# interface to the HSS, generating Milenage AKA vectors from MongoDB.
#
# Reference: 3GPP TS 24.229 Section 5.4, 3GPP TS 33.203, RFC 3310

#!define SCSCF_HOST "scscf.ims.mnc001.mcc001.3gppnetwork.org"
#!define SCSCF_IP "172.28.0.43"
#!define SCSCF_PORT 5060
#!define IMS_DOMAIN "ims.mnc001.mcc001.3gppnetwork.org"
#!define HSS_HOST "hss.localdomain"
#!define HSS_IP "172.28.0.40"
#!define AUTH_HELPER "172.28.0.44"
#!define AUTH_HELPER_PORT 9080

####### Global Parameters #########
debug=4
log_stderror=yes
memdbg=5
memlog=5

log_facility=LOG_LOCAL0
log_prefix="[S-CSCF] "

fork=yes
children=2
auto_aliases=no

listen=udp:SCSCF_IP:SCSCF_PORT
listen=tcp:SCSCF_IP:SCSCF_PORT

sip_warning=no
server_header="Server: VirtualPhone S-CSCF"
user_agent_header="User-Agent: VirtualPhone S-CSCF"

####### Modules Section ########

loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "textopsx.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "auth.so"
loadmodule "utils.so"

# -- module parameters --
modparam("tm", "fr_timer", 5000)
modparam("tm", "fr_inv_timer", 30000)
modparam("rr", "enable_full_lr", 0)
modparam("rr", "append_fromtag", 1)
modparam("registrar", "default_expires", 3600)
modparam("registrar", "max_expires", 7200)
modparam("registrar", "min_expires", 600)
modparam("usrloc", "db_mode", 0)
modparam("utils", "http_query_timeout", 5)

####### Routing Logic ########

request_route {
    route(REQINIT);

    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            route(RELAY);
        }
        exit;
    }

    if (!is_method("ACK")) {
        if (t_precheck_trans()) {
            t_check_trans();
            exit;
        }
        t_check_trans();
    }

    # Record-Route
    if (is_method("INVITE|SUBSCRIBE")) {
        record_route();
    }

    # Handle REGISTER with AKA authentication
    if (is_method("REGISTER")) {
        route(REGISTER);
        exit;
    }

    # Requests within a dialog
    if (has_totag()) {
        if (loose_route()) {
            route(RELAY);
            exit;
        }
    }

    # Look up registered contacts for routing
    if (is_method("INVITE")) {
        route(INVITE);
        exit;
    }

    route(RELAY);
}

route[REQINIT] {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    if (is_method("OPTIONS") && uri==myself) {
        sl_send_reply("200", "OK");
        exit;
    }

    if (!sanity_check("17895", "7")) {
        xlog("L_WARN", "Malformed SIP from $si:$sp\n");
        exit;
    }
}

# -- REGISTER with IMS AKA Authentication --
#
# Flow:
# 1. First REGISTER (no Authorization header) → fetch AKA vector from
#    auth-helper and send 401 with WWW-Authenticate challenge
# 2. Re-REGISTER (with Authorization header) → extract Digest fields,
#    verify via auth-helper, and send 200 OK on success
#
route[REGISTER] {
    xlog("L_INFO", "S-CSCF: REGISTER from $fu ($si:$sp)\n");

    if (!is_present_hf("Authorization")) {
        # First REGISTER - send 401 AKA challenge
        xlog("L_INFO", "S-CSCF: No Authorization header, sending 401 challenge\n");
        route(REGISTER_CHALLENGE);
        exit;
    }

    # Has Authorization header - verify the Digest-AKA response
    xlog("L_INFO", "S-CSCF: Authorization present, verifying AKA response\n");
    route(REGISTER_VERIFY);
}

# -- Send 401 AKA Challenge --
# Fetches an AKA auth vector from the auth-helper sidecar and constructs
# the WWW-Authenticate header with nonce = base64(RAND || AUTN).
route[REGISTER_CHALLENGE] {
    xlog("L_INFO", "S-CSCF: Generating AKA challenge for $fU\n");

    # Fetch AKA challenge from auth-helper
    $var(challenge_url) = "http://" + AUTH_HELPER + ":" + AUTH_HELPER_PORT
        + "/auth/challenge?imsi=" + $fU;

    http_query("$var(challenge_url)", "$var(www_auth)");
    if ($rc < 0 || $var(www_auth) == "") {
        xlog("L_ERR", "S-CSCF: Failed to fetch AKA challenge from auth-helper (rc=$rc)\n");
        sl_send_reply("500", "Auth Server Error");
        exit;
    }

    xlog("L_INFO", "S-CSCF: Sending 401 with AKA challenge for $fU\n");
    append_to_reply("WWW-Authenticate: $var(www_auth)\r\n");
    sl_send_reply("401", "Unauthorized");
    exit;
}

# -- Verify Digest-AKA Response --
# Extracts Digest fields from the Authorization header and sends them
# to the auth-helper for verification against the cached XRES.
route[REGISTER_VERIFY] {
    # Extract Digest fields from Authorization header
    $var(dig_username) = $(hdr(Authorization){re.subst,/.*username="([^"]+)".*/\1/});
    $var(dig_realm) = $(hdr(Authorization){re.subst,/.*realm="([^"]+)".*/\1/});
    $var(dig_uri) = $(hdr(Authorization){re.subst,/.*uri="([^"]+)".*/\1/});
    $var(dig_nc) = $(hdr(Authorization){re.subst,/.*nc=([0-9a-fA-F]+).*/\1/});
    $var(dig_cnonce) = $(hdr(Authorization){re.subst,/.*cnonce="([^"]+)".*/\1/});
    $var(dig_qop) = $(hdr(Authorization){re.subst,/.*[ ,]qop=([a-zA-Z]+).*/\1/});
    $var(dig_response) = $(hdr(Authorization){re.subst,/.*response="([^"]+)".*/\1/});

    xlog("L_INFO", "S-CSCF: Verifying Digest-AKA for user=$var(dig_username)\n");

    # Build verification URL with extracted Digest fields
    $var(verify_url) = "http://" + AUTH_HELPER + ":" + AUTH_HELPER_PORT
        + "/auth/verify?imsi=" + $fU
        + "&username=" + $var(dig_username)
        + "&realm=" + $var(dig_realm)
        + "&uri=" + $var(dig_uri)
        + "&nc=" + $var(dig_nc)
        + "&cnonce=" + $var(dig_cnonce)
        + "&qop=" + $var(dig_qop)
        + "&response=" + $var(dig_response);

    http_query("$var(verify_url)", "$var(verify_result)");
    if ($rc < 0) {
        xlog("L_ERR", "S-CSCF: Auth verification request failed (rc=$rc)\n");
        sl_send_reply("500", "Server Error");
        exit;
    }

    if ($var(verify_result) != "OK") {
        xlog("L_WARN", "S-CSCF: AKA verification FAILED for $fU (result=$var(verify_result))\n");
        sl_send_reply("403", "Forbidden");
        exit;
    }

    xlog("L_INFO", "S-CSCF: AKA verification SUCCESS for $fU\n");

    # Save the registration
    if (!save("location")) {
        sl_reply_error();
        exit;
    }

    # Add IMS-specific headers to 200 OK
    # Service-Route: the path for subsequent requests
    append_hf("Service-Route: <sip:SCSCF_IP:SCSCF_PORT;lr>\r\n");

    # P-Associated-URI: the registered public identities
    append_hf("P-Associated-URI: <$fu>\r\n");

    xlog("L_INFO", "S-CSCF: Registration successful for $fu\n");
    exit;
}

# -- INVITE handling --
route[INVITE] {
    xlog("L_INFO", "S-CSCF: INVITE to $ru from $fu\n");

    if (!lookup("location")) {
        sl_send_reply("404", "User Not Found");
        exit;
    }

    record_route();
    route(RELAY);
}

# -- Generic relay --
route[RELAY] {
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

onreply_route {
    xlog("L_INFO", "S-CSCF: Reply $rs $rr\n");
}

failure_route[FAIL] {
    if (t_is_canceled()) {
        exit;
    }
}
