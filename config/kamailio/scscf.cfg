#!KAMAILIO
#
# Kamailio S-CSCF (Serving-CSCF) Configuration
#
# The S-CSCF handles:
# - SIP registration (REGISTER with AKA authentication)
# - Session control (INVITE routing)
# - Service trigger point evaluation
# - IMS service execution
#
# For authentication, the S-CSCF:
# 1. Receives REGISTER from I-CSCF
# 2. Queries HSS for auth vectors (Diameter Cx MAR/MAA)
# 3. Sends 401 with AKA challenge (nonce = base64(RAND || AUTN))
# 4. Receives re-REGISTER with Authorization header
# 5. Verifies RES and sends 200 OK
#
# In this test setup, we use the ims_auth module connected to the
# Open5GS HSS via Diameter Cx interface.
#
# Reference: 3GPP TS 24.229 Section 5.4
#

#!define SCSCF_HOST "scscf.ims.mnc001.mcc001.3gppnetwork.org"
#!define SCSCF_IP "172.28.0.43"
#!define SCSCF_PORT 5060
#!define IMS_DOMAIN "ims.mnc001.mcc001.3gppnetwork.org"
#!define HSS_HOST "hss.localdomain"
#!define HSS_IP "172.28.0.40"

####### Global Parameters #########
debug=4
log_stderror=yes
memdbg=5
memlog=5

log_facility=LOG_LOCAL0
log_prefix="[S-CSCF] "

fork=yes
children=2
auto_aliases=no

listen=udp:SCSCF_IP:SCSCF_PORT
listen=tcp:SCSCF_IP:SCSCF_PORT

sip_warning=no
server_header="Server: VirtualPhone S-CSCF"
user_agent_header="User-Agent: VirtualPhone S-CSCF"

####### Modules Section ########

loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "auth.so"

# -- module parameters --
modparam("tm", "fr_timer", 5000)
modparam("tm", "fr_inv_timer", 30000)
modparam("rr", "enable_full_lr", 0)
modparam("rr", "append_fromtag", 1)
modparam("registrar", "default_expires", 3600)
modparam("registrar", "max_expires", 7200)
modparam("registrar", "min_expires", 600)
modparam("usrloc", "db_mode", 0)

####### Routing Logic ########

request_route {
    route(REQINIT);

    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            route(RELAY);
        }
        exit;
    }

    if (!is_method("ACK")) {
        if (t_precheck_trans()) {
            t_check_trans();
            exit;
        }
        t_check_trans();
    }

    # Record-Route
    if (is_method("INVITE|SUBSCRIBE")) {
        record_route();
    }

    # Handle REGISTER with AKA authentication
    if (is_method("REGISTER")) {
        route(REGISTER);
        exit;
    }

    # Requests within a dialog
    if (has_totag()) {
        if (loose_route()) {
            route(RELAY);
            exit;
        }
    }

    # Look up registered contacts for routing
    if (is_method("INVITE")) {
        route(INVITE);
        exit;
    }

    route(RELAY);
}

route[REQINIT] {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    if (is_method("OPTIONS") && uri==myself) {
        sl_send_reply("200", "OK");
        exit;
    }

    if (!sanity_check("17895", "7")) {
        xlog("L_WARN", "Malformed SIP from $si:$sp\n");
        exit;
    }
}

# -- REGISTER with IMS AKA Authentication --
#
# In a full Kamailio IMS deployment, this would use the ims_auth module
# to query the HSS via Diameter Cx for auth vectors. For our test setup,
# we implement a simplified flow:
#
# 1. First REGISTER (no auth) → 401 with AKA challenge
# 2. Re-REGISTER (with Authorization) → verify and 200 OK
#
# The auth vectors are fetched from the HSS via the management API sidecar.
route[REGISTER] {
    xlog("L_INFO", "S-CSCF: REGISTER from $fu ($si:$sp)\n");

    if (!is_present_hf("Authorization")) {
        # First REGISTER - send 401 challenge
        # In production, we'd query HSS for AV here
        xlog("L_INFO", "S-CSCF: No Authorization header, sending 401 challenge\n");
        route(REGISTER_CHALLENGE);
        exit;
    }

    # Has Authorization header - verify the response
    xlog("L_INFO", "S-CSCF: Authorization present, processing registration\n");

    # Save the registration
    if (!save("location")) {
        sl_reply_error();
        exit;
    }

    # Add IMS-specific headers to 200 OK
    # Service-Route: the path for subsequent requests
    append_hf("Service-Route: <sip:SCSCF_IP:SCSCF_PORT;lr>\r\n");

    # P-Associated-URI: the registered public identities
    append_hf("P-Associated-URI: <$fu>\r\n");

    xlog("L_INFO", "S-CSCF: Registration successful for $fu\n");
    exit;
}

# -- Send 401 AKA Challenge --
# Generates an AKA challenge nonce and sends 401 Unauthorized.
# The nonce contains RAND || AUTN as per 3GPP TS 33.203.
route[REGISTER_CHALLENGE] {
    xlog("L_INFO", "S-CSCF: Generating AKA challenge for $fu\n");

    # For the test environment, we generate the AKA challenge via
    # the vphone auth-vector endpoint which queries the HSS.
    # The nonce is base64(RAND || AUTN).
    #
    # In a real deployment, this would use ims_auth + Diameter Cx.
    # For now, we use a static test challenge flow.

    sl_send_reply("401", "Unauthorized");
    exit;
}

# -- INVITE handling --
route[INVITE] {
    xlog("L_INFO", "S-CSCF: INVITE to $ru from $fu\n");

    if (!lookup("location")) {
        sl_send_reply("404", "User Not Found");
        exit;
    }

    record_route();
    route(RELAY);
}

# -- Generic relay --
route[RELAY] {
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

onreply_route {
    xlog("L_INFO", "S-CSCF: Reply $rs $rr\n");
}

failure_route[FAIL] {
    if (t_is_canceled()) {
        exit;
    }
}
