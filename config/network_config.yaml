# Network configuration for the virtual telecom environment
network:
  # Virtual operator PLMN
  mcc: "001"
  mnc: "01"
  operator_name: "Virtual Operator"

  # RSP (Remote SIM Provisioning)
  rsp:
    # SM-DP+ server address
    smdp_address: ""
    # TLS verification
    tls_verify: true
    # Connection timeout (seconds)
    timeout: 30

  # APN configuration
  apn:
    default:
      name: "internet"
      protocol: "IPV4V6"
      type: "default,supl"
    ims:
      name: "ims"
      protocol: "IPV4V6"
      type: "ims"

  # DNS (use local CoreDNS for IMS domain resolution when IMS core is running)
  dns:
    servers:
      - "172.28.0.50"  # Local CoreDNS (IMS domain)
      - "8.8.8.8"

# Docker networking
docker:
  network_name: "telecom-net"
  subnet: "172.28.0.0/24"
  redroid_ip: "172.28.0.10"
  vphone_ip: "172.28.0.20"
  # IMS core addresses (assigned in docker-compose.yml)
  mme_ip: "172.28.0.30"
  sgwc_ip: "172.28.0.31"
  smf_ip: "172.28.0.32"
  sgwu_ip: "172.28.0.33"
  upf_ip: "172.28.0.34"
  pcrf_ip: "172.28.0.35"
  mongodb_ip: "172.28.0.39"
  hss_ip: "172.28.0.40"
  pcscf_ip: "172.28.0.41"
  icscf_ip: "172.28.0.42"
  scscf_ip: "172.28.0.43"
  auth_helper_ip: "172.28.0.44"
  dns_ip: "172.28.0.50"

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s [%(name)s] %(levelname)s: %(message)s"
  file: "/var/log/vphone/vphone.log"
  max_size_mb: 50
  backup_count: 5
