# ePDG swanctl configuration
# Implements the SWu interface (UE <-> ePDG) per 3GPP TS 33.402
#
# Authentication: EAP-AKA (via simaka-sql quintuplets from Milenage)
# Virtual IP pool: 10.47.0.0/24
# P-CSCF delivery: via IKEv2 CFG_REPLY attributes

connections {
    epdg {
        # IKEv2 only
        version = 2

        # IKE proposals (strong but compatible)
        proposals = aes256-sha256-modp2048,aes128-sha256-modp2048

        # Dead Peer Detection
        dpd_delay = 30s
        dpd_timeout = 150s

        # ePDG authenticates with certificate
        local {
            auth = pubkey
            certs = epdg.cert.pem
            id = epdg.epc.mnc001.mcc001.3gppnetwork.org
        }

        # UE authenticates with EAP-AKA
        remote {
            auth = eap-aka
            eap_id = %any
        }

        # Assign virtual IP from pool
        pools = vowifi-pool

        children {
            vowifi {
                # ESP proposals
                esp_proposals = aes256-sha256,aes128-sha256

                # Traffic selectors
                local_ts = 0.0.0.0/0
                remote_ts = dynamic

                # Rekey interval
                rekey_time = 3600s

                # DPD action
                dpd_action = restart
            }
        }

        # Send config payloads (virtual IP, DNS)
        send_certreq = no
    }
}

pools {
    vowifi-pool {
        # Virtual IP range for VoWiFi UEs
        addrs = 10.47.0.0/24

        # DNS server (CoreDNS in docker network)
        dns = 172.28.0.50
    }
}

secrets {
    # ePDG private key
    private-epdg {
        file = epdg.key.pem
    }
}
