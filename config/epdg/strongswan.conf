# strongSwan configuration for ePDG
# Reference: 3GPP TS 33.402 (ePDG security), 3GPP TS 24.302 (SWu interface)

charon {
    # Log to stderr for Docker
    filelog {
        stderr {
            default = 1
            ike = 2
            cfg = 2
            eap = 2
        }
    }

    # Load required plugins
    load_modular = yes

    plugins {
        # EAP-AKA with SQL backend for quintuplets
        eap-aka {
            # Prefer full authentication
            request_identity = yes
        }

        eap-simaka-sql {
            # SQLite database with pre-generated AKA quintuplets
            database = sqlite:///var/lib/epdg/aka_quintuplets.db
            remove_used = no
        }

        # Attribute provider for P-CSCF and DNS delivery via IKEv2 CFG_REPLY
        attr {
            # DNS server
            dns = 172.28.0.50
            # P-CSCF IPv4 address (3GPP vendor attribute, type 16384, vendor 10415)
            # Delivered to UE in IKEv2 CFG_REPLY per 3GPP TS 24.302 Section 7.4
            16384-10415 = 172.28.0.43
        }
    }
}
