[supervisord]
nodaemon=true
logfile=/var/log/vphone/supervisord.log
pidfile=/run/vphone/supervisord.pid
childlogdir=/var/log/vphone

[program:euicc-daemon]
command=vphone-euicc
directory=/opt/vphone
user=vphone
autostart=true
autorestart=true
stdout_logfile=/var/log/vphone/euicc.log
stderr_logfile=/var/log/vphone/euicc-error.log

[program:rsp-client]
command=vphone-rsp
directory=/opt/vphone
user=vphone
autostart=true
autorestart=true
stdout_logfile=/var/log/vphone/rsp.log
stderr_logfile=/var/log/vphone/rsp-error.log

[program:ims-client]
command=vphone-ims
directory=/opt/vphone
user=vphone
autostart=true
autorestart=true
stdout_logfile=/var/log/vphone/ims.log
stderr_logfile=/var/log/vphone/ims-error.log

[program:hal-bridge]
command=vphone-hal
directory=/opt/vphone
user=root
autostart=true
autorestart=true
stdout_logfile=/var/log/vphone/hal.log
stderr_logfile=/var/log/vphone/hal-error.log

[program:management-api]
command=uvicorn hal.management_api:app --host 0.0.0.0 --port 9000
directory=/opt/vphone
user=vphone
autostart=true
autorestart=true
stdout_logfile=/var/log/vphone/api.log
stderr_logfile=/var/log/vphone/api-error.log
